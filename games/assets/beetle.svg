<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <g>
    <!-- Stubby beetle legs peeking from under shell -->
    <path d="M22 48 Q16 44 10 48" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M78 48 Q84 44 90 48" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M20 60 Q14 58 8 62" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M80 60 Q86 58 92 62" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M22 72 Q16 72 10 78" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M78 72 Q84 72 90 78" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Shell/elytra (bright green) -->
    <ellipse cx="50" cy="58" rx="32" ry="36" fill="#00FF00" stroke="#000" stroke-width="2"/>

    <!-- 3D dome highlight -->
    <ellipse cx="40" cy="46" rx="14" ry="16" fill="white" opacity="0.12" transform="rotate(-10 40 46)"/>
    <!-- 3D shadow at bottom -->
    <ellipse cx="50" cy="82" rx="20" ry="8" fill="#000" opacity="0.06"/>

    <!-- Elytra split line (center) -->
    <line x1="50" y1="28" x2="50" y2="92" stroke="#000" stroke-width="2"/>

    <!-- Elytra outline curves (wing cover definition) -->
    <path d="M50 28 Q28 28 22 58 Q20 82 50 92" fill="none" stroke="#000" stroke-width="0.8" opacity="0.3"/>
    <path d="M50 28 Q72 28 78 58 Q80 82 50 92" fill="none" stroke="#000" stroke-width="0.8" opacity="0.3"/>

    <!-- Elytral striae (longitudinal ridges) -->
    <line x1="36" y1="32" x2="34" y2="88" stroke="#000" stroke-width="0.5" opacity="0.15"/>
    <line x1="42" y1="28" x2="41" y2="90" stroke="#000" stroke-width="0.5" opacity="0.15"/>
    <line x1="58" y1="28" x2="59" y2="90" stroke="#000" stroke-width="0.5" opacity="0.15"/>
    <line x1="64" y1="32" x2="66" y2="88" stroke="#000" stroke-width="0.5" opacity="0.15"/>

    <!-- Elytra separation at rear -->
    <path d="M48 90 Q50 94 52 90" fill="none" stroke="#000" stroke-width="1" opacity="0.5"/>

    <!-- Pronotum (shield between head and shell) -->
    <ellipse cx="50" cy="26" rx="22" ry="8" fill="#00FF00" stroke="#000" stroke-width="1.8"/>
    <!-- Pronotum texture line -->
    <path d="M32 26 Q50 22 68 26" fill="none" stroke="#000" stroke-width="0.5" opacity="0.2"/>

    <!-- Head (black - distinctive for beetle) -->
    <circle cx="50" cy="14" r="11" fill="#000" stroke="#000" stroke-width="1.5"/>

    <!-- Mandibles -->
    <path d="M44 22 Q40 26 42 28" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M56 22 Q60 26 58 28" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Horns (within viewBox) -->
    <path d="M44 8 Q40 4 42 2" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M56 8 Q60 4 58 2" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eyes (white on black head) -->
    <circle cx="44" cy="12" r="2" fill="white"/>
    <circle cx="56" cy="12" r="2" fill="white"/>
    <!-- Eye pupils -->
    <circle cx="44" cy="12" r="0.8" fill="#000"/>
    <circle cx="56" cy="12" r="0.8" fill="#000"/>
  </g>
</svg>
