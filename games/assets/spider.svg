<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <g>
    <!-- 8 jointed legs radiating from cephalothorax -->
    <!-- Front-left pair (angled up-forward) -->
    <path d="M38 32 Q26 22 14 12" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M14 12 Q8 8 4 4" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="14" cy="12" r="1.3" fill="#000"/>

    <!-- Front-right pair -->
    <path d="M62 32 Q74 22 86 12" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M86 12 Q92 8 96 4" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="86" cy="12" r="1.3" fill="#000"/>

    <!-- Second-left pair (angled out-forward) -->
    <path d="M36 36 Q20 32 8 28" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M8 28 Q2 28 0 32" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="8" cy="28" r="1.3" fill="#000"/>

    <!-- Second-right pair -->
    <path d="M64 36 Q80 32 92 28" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M92 28 Q98 28 100 32" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="92" cy="28" r="1.3" fill="#000"/>

    <!-- Third-left pair (angled out-back) -->
    <path d="M36 42 Q20 46 8 52" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M8 52 Q2 56 0 62" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="8" cy="52" r="1.3" fill="#000"/>

    <!-- Third-right pair -->
    <path d="M64 42 Q80 46 92 52" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M92 52 Q98 56 100 62" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="92" cy="52" r="1.3" fill="#000"/>

    <!-- Rear-left pair (angled down-back) -->
    <path d="M38 46 Q26 58 16 72" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M16 72 Q10 80 6 88" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="16" cy="72" r="1.3" fill="#000"/>

    <!-- Rear-right pair -->
    <path d="M62 46 Q74 58 84 72" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M84 72 Q90 80 94 88" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="84" cy="72" r="1.3" fill="#000"/>

    <!-- Abdomen (large, round) -->
    <ellipse cx="50" cy="64" rx="18" ry="22" fill="#00FF00" stroke="#000" stroke-width="2"/>
    <!-- Abdomen 3D highlight -->
    <ellipse cx="45" cy="57" rx="8" ry="10" fill="white" opacity="0.12"/>
    <!-- Dorsal marking (diamond/chevron) -->
    <path d="M50 50 L44 58 L50 66 L56 58 Z" fill="#000" opacity="0.12" stroke="none"/>
    <!-- Secondary marking chevrons -->
    <path d="M46 62 L50 58 L54 62" fill="none" stroke="#000" stroke-width="0.6" opacity="0.2"/>
    <path d="M47 68 L50 64 L53 68" fill="none" stroke="#000" stroke-width="0.6" opacity="0.2"/>

    <!-- Cephalothorax (smaller front section) -->
    <ellipse cx="50" cy="36" rx="14" ry="14" fill="#00FF00" stroke="#000" stroke-width="2"/>
    <!-- Cephalothorax 3D highlight -->
    <ellipse cx="47" cy="32" rx="6" ry="6" fill="white" opacity="0.1"/>

    <!-- Multiple eyes (two rows, spider-like arrangement) -->
    <!-- Front row (4 eyes) -->
    <circle cx="44" cy="30" r="2" fill="#000"/>
    <circle cx="48" cy="29" r="2.2" fill="#000"/>
    <circle cx="52" cy="29" r="2.2" fill="#000"/>
    <circle cx="56" cy="30" r="2" fill="#000"/>
    <!-- Back row (2 eyes) -->
    <circle cx="46" cy="34" r="1.3" fill="#000"/>
    <circle cx="54" cy="34" r="1.3" fill="#000"/>
    <!-- Eye highlights on main pair -->
    <circle cx="48.5" cy="28.5" r="0.7" fill="white"/>
    <circle cx="52.5" cy="28.5" r="0.7" fill="white"/>

    <!-- Chelicerae (fangs) -->
    <path d="M47 44 L45 49" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M53 44 L55 49" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
